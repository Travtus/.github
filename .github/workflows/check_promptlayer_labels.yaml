name: Check PromptLayer labels

on:
  workflow_call:
    inputs:
      PROMPTS_FILE:
        description: Path in the calling repo to the prompt list, one prompt name per line.
        type: string
        default: promptlayer-prompts.txt
      LABEL_A:
        description: Label whose version is the reference.
        type: string
        default: uat
      LABEL_B:
        description: Label that must point to the same version as LABEL_A.
        type: string
        default: prod
    secrets:
      PROMPTLAYER_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  check-promptlayer-labels:
    name: Verify PromptLayer labels point to the same prompt versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v7

      - name: Compare label versions
        shell: bash
        env:
          PROMPTLAYER_API_KEY: ${{ secrets.PROMPTLAYER_API_KEY }}
          PROMPTS_FILE: ${{ inputs.PROMPTS_FILE }}
          LABEL_A: ${{ inputs.LABEL_A }}
          LABEL_B: ${{ inputs.LABEL_B }}
        run: |
          set -euo pipefail

          if [ ! -f "$PROMPTS_FILE" ]; then
            echo "::error::Prompt list '$PROMPTS_FILE' not found."
            exit 1
          fi

          # Prints the version a label points to, or nothing when it cannot be resolved.
          label_version() {
            local name="$1" label="$2" response status
            response="$(curl -sS --max-time 30 -w '\n%{http_code}' -X POST \
              "https://api.promptlayer.com/prompt-templates/$(jq -rn --arg n "$name" '$n|@uri')" \
              -H "X-API-KEY: $PROMPTLAYER_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg l "$label" '{label: $l}')")"
            status="${response##*$'\n'}"
            if [ "$status" != "200" ]; then
              echo "::error::$name: PromptLayer returned HTTP $status for label '$label' (missing label, unknown prompt or bad API key)." >&2
              return 0
            fi
            jq -r '.version // empty' <<< "${response%$'\n'*}"
          }

          checked=0
          failed=0
          while IFS= read -r line || [ -n "$line" ]; do
            name="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' <<< "$line")"
            case "$name" in
              '' | '#'*) continue ;;
              *==*)
                echo "::error::$name: version pinning is not supported yet; list the prompt name only."
                failed=1
                continue
                ;;
            esac

            checked=$((checked + 1))
            version_a="$(label_version "$name" "$LABEL_A")"
            version_b="$(label_version "$name" "$LABEL_B")"

            if [ -z "$version_a" ] || [ -z "$version_b" ]; then
              failed=1
            elif [ "$version_a" != "$version_b" ]; then
              echo "::error::$name: $LABEL_A is version $version_a, $LABEL_B is version $version_b."
              failed=1
            else
              echo "ok  $name: $LABEL_A and $LABEL_B are both version $version_a"
            fi
          done < "$PROMPTS_FILE"

          if [ "$checked" -eq 0 ] && [ "$failed" -eq 0 ]; then
            echo "::error::Prompt list '$PROMPTS_FILE' has no prompts."
            exit 1
          fi

          exit "$failed"
