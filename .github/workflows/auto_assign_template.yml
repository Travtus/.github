name: Assign PR reviewers

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    steps:
      - name: Mint Platform Admin token
        id: platform-admin-token
        if: ${{ secrets.GH_TOKEN == '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLATFORM_ADMIN_APP_ID }}
          private-key: ${{ secrets.PLATFORM_ADMIN_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Get config file
        run: |
          curl -fsSL https://raw.githubusercontent.com/Travtus/.github/main/.github/reviewer_config.yml -o reviewer_config.yml
      - name: Request review based on files changes
        uses: necojackarc/auto-request-review@v0.13.0
        with:
          token: ${{ steps.platform-admin-token.outputs.token || secrets.GH_TOKEN }}
          config: reviewer_config.yml
          use_local: true
