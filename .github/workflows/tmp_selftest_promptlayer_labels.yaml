name: TEMP self-test PromptLayer label gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  selftest:
    uses: ./.github/workflows/check_promptlayer_labels.yaml
    with:
      PROMPTS_FILE: tmp-selftest/prompts.txt
    secrets:
      PROMPTLAYER_API_KEY: ${{ secrets.PROMPTLAYER_API_KEY }}
