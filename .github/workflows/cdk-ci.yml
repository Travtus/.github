name: CDK CI (lint, types, synth)

on:
  workflow_call:
    inputs:
      APP:
        type: string
        required: true
        description: "Path to the CDK app entrypoint, e.g. deploy/app.py."
      ENVS:
        type: string
        required: false
        default: '["dev","qa","uat"]'
        description: 'JSON array of envs to synth, e.g. ["dev","qa","uat"].'
      MYPY_PATH:
        type: string
        required: false
        default: "src"
        description: "Path passed to `mypy`, e.g. src or deploy."
      DEP_REPOS:
        type: string
        required: false
        default: "platform-infra-toolkit"
        description: "Private repo(s) the App token may read for uv sync (newline/space separated)."
      WORKING_DIRECTORY:
        type: string
        required: false
        default: "."
        description: "Directory containing pyproject.toml / cdk.json."
      PYTHON_VERSION:
        type: string
        required: false
        default: "3.13"

permissions:
  contents: read

jobs:
  lint-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
      - name: Mint App token for private dependencies
        id: dep-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLATFORM_ADMIN_APP_ID }}
          private-key: ${{ secrets.PLATFORM_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.DEP_REPOS }}
      - name: Authenticate git for private dependencies
        env:
          GH_APP_TOKEN: ${{ steps.dep-token.outputs.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy ${{ inputs.MYPY_PATH }}

  synth:
    needs: lint-types
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJSON(inputs.ENVS) }}
    defaults:
      run:
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
      - name: Mint App token for private dependencies
        id: dep-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLATFORM_ADMIN_APP_ID }}
          private-key: ${{ secrets.PLATFORM_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.DEP_REPOS }}
      - name: Authenticate git for private dependencies
        env:
          GH_APP_TOKEN: ${{ steps.dep-token.outputs.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
      - run: uv sync
      - run: CDK_CONTEXT_JSON='{"env":"${{ matrix.env }}"}' uv run python ${{ inputs.APP }}
